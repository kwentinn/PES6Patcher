name: Bug
description: Something the patch breaks or does wrong
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What goes wrong
      description: The problem, in a few sentences. One problem per issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The steps - game mode, where on the pitch, which buttons, in which order. Say whether it happens every time.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Behaviour seen (game with the patch)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Behaviour expected
      description: What should happen. If you know it, what the game without the patch does in the same situation.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Patcher version
      description: The exact PES6Patcher version used, as shown in the window title or the release name (for example 1.32.0).
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Patcher report or saved configuration
      description: Paste the report (the "Copy report" button in the patcher), or the content of the PES6.exe.patcher.ini file saved next to PES6.exe.
      render: text
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and community patch
      description: Where the PES6.exe comes from - original game, or the name and version of the community patch.
    validations:
      required: false
  - type: input
    id: isolate
    attributes:
      label: Option that causes it
      description: If you tried - the option that makes the problem go away when you untick it and patch again.
    validations:
      required: false
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: If possible, a screenshot or a short video showing the problem. Drag the files here.
    validations:
      required: false
